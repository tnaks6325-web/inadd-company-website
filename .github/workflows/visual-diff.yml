# PR 이 열리거나 새 커밋이 올라오면, 수정 전(main)·수정 후(PR) 화면을 같은 조건으로 찍어
# 달라진 곳만 "왼쪽 수정 전 / 오른쪽 수정 후" 비교 그림으로 PR 댓글에 올린다.
# 댓글에 저장소 주인을 언급하므로 GitHub 알림 메일로도 받는다.
# 두 쪽 모두 이 작업 컴퓨터 안에서 띄운 로컬 서버(빈 데이터)로 찍는다 — 실제 사이트·운영 데이터는 건드리지 않는다.
# 그림은 visual-diff-images 브랜치에 보관한다(Cloudflare 미리보기 배포 대상에서 제외해 둠).
name: 화면 비교 캡처

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write       # 그림 보관 브랜치에 올리기
  pull-requests: write  # 댓글 달기

concurrency:
  group: visual-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    # 다른 사람 저장소에서 온 PR 은 쓰기 권한이 없어 건너뜀
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_URL: http://127.0.0.1:5101
      HEAD_URL: http://127.0.0.1:5102
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: 수정 후(PR) 코드 받기
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
      - name: 수정 전(main) 코드 받기
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 부품 설치
        run: |
          (cd base && npm ci --no-audit --no-fund)
          (cd head && npm ci --no-audit --no-fund)
          (cd head/scripts/visual-diff && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium)
          sudo apt-get install -y -qq fonts-noto-cjk > /dev/null

      - name: 로컬 서버 두 개 띄우기
        run: |
          (cd base && nohup npx vite --port 5101 --strictPort --host 127.0.0.1 > "$RUNNER_TEMP/base.log" 2>&1 &)
          (cd head && nohup npx vite --port 5102 --strictPort --host 127.0.0.1 > "$RUNNER_TEMP/head.log" 2>&1 &)
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "$BASE_URL/" && curl -sf -o /dev/null "$HEAD_URL/"; then echo "서버 준비됨"; exit 0; fi
            sleep 2
          done
          echo "서버가 뜨지 않음"; cat "$RUNNER_TEMP/base.log" "$RUNNER_TEMP/head.log"; exit 1

      - name: 화면 찍고 비교
        run: node head/scripts/visual-diff/run.mjs --base "$BASE_URL" --head "$HEAD_URL" --out "$RUNNER_TEMP/out"

      - name: 그림 보관 브랜치에 올리기
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT="$RUNNER_TEMP/out"
          DIR="pr-$PR/${HEAD_SHA:0:7}-${{ github.run_attempt }}"
          echo "img_base=https://raw.githubusercontent.com/${{ github.repository }}/visual-diff-images/$DIR" >> "$GITHUB_OUTPUT"
          ls "$OUT"/*.png > /dev/null 2>&1 || { echo "올릴 그림 없음"; exit 0; }
          cd "$RUNNER_TEMP"
          git init -q img && cd img
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          if git fetch -q --depth 1 origin visual-diff-images; then
            git checkout -q -b visual-diff-images FETCH_HEAD
          else
            git checkout -q --orphan visual-diff-images
            printf '# 화면 비교 캡처 그림 보관용\n\nPR 댓글에 붙는 수정 전·후 비교 그림만 모아 두는 브랜치입니다. 사이트 코드와 무관합니다.\n' > README.md
          fi
          mkdir -p "$DIR" && cp "$OUT"/*.png "$DIR"/
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "PR #$PR 화면 비교 그림 (${HEAD_SHA:0:7})"
          for i in 1 2 3 4 5; do
            git push -q origin visual-diff-images && exit 0
            git fetch -q --depth 1 origin visual-diff-images && git rebase -q FETCH_HEAD
          done
          exit 1

      - name: PR 에 댓글 달기
        env:
          GH_TOKEN: ${{ github.token }}
          IMG_BASE: ${{ steps.publish.outputs.img_base }}
        run: |
          {
            echo "@${{ github.repository_owner }} 수정본 화면 비교가 준비됐습니다. (커밋 \`${HEAD_SHA:0:7}\`)"
            echo
            echo "**이 메일에 '승인' 두 글자만 답장하면 실제 사이트에 반영됩니다.** 고칠 점은 답장에 적으면 수정한 분께 그대로 전달됩니다."
            echo
            sed "s#{{IMG_BASE}}#${IMG_BASE}#g" "$RUNNER_TEMP/out/comment.md"
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --repo "${{ github.repository }}" --body-file "$RUNNER_TEMP/comment.md"

      - name: 실패하면 알리기
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "$PR" --repo "${{ github.repository }}" --body \
            "@${{ github.repository_owner }} 화면 비교 캡처를 만들지 못했습니다. (커밋 \`${HEAD_SHA:0:7}\`) 이 수정본은 메일 답장으로 승인할 수 없습니다. 테스트 서버 주소에서 직접 확인한 뒤 GitHub 화면에서 승인해 주세요. 기록: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
